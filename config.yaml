# 3AI 协作投资系统配置
# 三方共享：GLM + Kimi + MiniMax

llm:
  provider: deepseek          # deepseek / minimax / glm
  model: deepseek-chat
  api_key: ""                  # 从环境变量 DEEPSEEK_API_KEY 读取，或在此填写
  base_url: "https://api.deepseek.com/v1"

data_collection:
  sources: ["xueqiu", "wechat"]
  target_date: "2026-07-04"
  max_articles_per_source: 50
  xueqiu_authors: []
  wechat_accounts: []

technical_analysis:
  stocks: []                   # 如 ["sh.600519", "sz.000001"]
  start_date: "2025-01-01"
  end_date: "2026-07-04"
  strategies: ["turtle_trade", "ma_volume", "rps_breakout"]
  backtest_window_days: 120

decision_engine:
  target_concepts: []          # 如 ["液冷服务器", "固态电池"]
  max_debate_rounds: 3
  kelly_half: true             # 使用半Kelly
  max_position_ratio: 0.25     # 单标的最大仓位25%

risk_control:
  max_single_stock_ratio: 0.25
  max_sector_ratio: 0.30
  max_drawdown_stop: 0.15

notification:
  enabled: false
  feishu_webhook: ""
  wechat_push: false

dashboard:
  output_dir: "dashboard"
  template: "default"
